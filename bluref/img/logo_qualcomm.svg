<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <rect width="220" height="60" fill="none"/>
  <!-- Qualcomm Q mark -->
  <g transform="translate(4,8)">
    <!-- Outer Q circle -->
    <circle cx="22" cy="22" r="20" fill="none" stroke="#3253DC" stroke-width="5"/>
    <!-- Q tail -->
    <line x1="30" y1="30" x2="42" y2="42" stroke="#3253DC" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner dot -->
    <circle cx="22" cy="22" r="6" fill="#3253DC"/>
  </g>
  <!-- QUALCOMM text -->
  <text x="58" y="28" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#3253DC" letter-spacing="1">QUALCOMM</text>
  <!-- AI Research subtitle -->
  <text x="58" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555" letter-spacing="0.5">AI Research</text>
</svg>
