<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- UW-Madison Block W logo approximation -->
  <rect width="200" height="60" fill="none"/>
  <!-- Red W block -->
  <g transform="translate(4,4)">
    <!-- W shape in UW red -->
    <polygon points="0,0 8,0 14,32 20,12 26,32 32,0 40,0 28,52 20,28 12,52" fill="#c5050c"/>
    <!-- Crest border effect -->
    <polygon points="0,0 8,0 14,32 20,12 26,32 32,0 40,0 28,52 20,28 12,52" fill="none" stroke="#9b0000" stroke-width="1"/>
  </g>
  <!-- Text -->
  <text x="52" y="22" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#c5050c" letter-spacing="0.5">UNIVERSITY OF WISCONSIN</text>
  <text x="52" y="36" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#c5050c" letter-spacing="0.5">MADISON</text>
  <text x="52" y="50" font-family="Georgia, serif" font-size="8" fill="#555" letter-spacing="0.3">Computer Sciences</text>
</svg>
